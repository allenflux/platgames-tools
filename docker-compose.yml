services:
  platgames-tools:
    build:
      context: .
    ports:
      - "${TOOLS_BIND_IP:-0.0.0.0}:9100:9100"
    command: ["python3", "vendor_debug_server.py", "--host", "0.0.0.0", "--port", "9100"]
    volumes:
      - type: bind
        source: ./config/private/panda_signing.key
        target: /app/config/private/panda_signing.key
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:9100/api/health', timeout=3))['ok'] is True"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
